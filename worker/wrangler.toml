name = "private-photo-sharing"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "photo_sharing_db"
database_id = "YOUR_DATABASE_ID"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "photo-sharing-photos"

[vars]
SENDER_EMAIL = "photos@yourdomain.com"

[[send_email]]
name = "SEND_EMAIL" 